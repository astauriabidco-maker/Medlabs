# ============================================
# MedLab Secrets — Base template
# ============================================
# IMPORTANT: Replace placeholder values before applying!
# In CI/CD, these are injected via kubectl create secret
# or from GitHub Secrets via envsubst.
#
# Generate base64 values:
#   echo -n 'your-value' | base64

apiVersion: v1
kind: Secret
metadata:
  name: medlab-secrets
  namespace: medlab
type: Opaque
data:
  # Database
  DB_PASSWORD: Q0hBTkdFX01FX1NUUk9OR19QQVNTV09SRA==    # CHANGE_ME_STRONG_PASSWORD
  DATABASE_URL: ""                                         # Set in deployment as composed value
  
  # JWT
  JWT_SECRET: Q0hBTkdFX01FX1JBTkRPTV82NF9DSEFSU19TVFJJTkc=  # CHANGE_ME_RANDOM_64_CHAR_STRING
  
  # MinIO/S3
  MINIO_ACCESS_KEY: Q0hBTkdFX01FX0FDQ0VTU19LRVk=         # CHANGE_ME_ACCESS_KEY
  MINIO_SECRET_KEY: Q0hBTkdFX01FX1NFQ1JFVF9LRVk=         # CHANGE_ME_SECRET_KEY
  
  # Sentry
  SENTRY_DSN: ""
