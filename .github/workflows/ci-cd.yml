# ============================================
# MedLab CI/CD Pipeline — GitHub Actions
# ============================================
# Triggers: Push to main/develop, Pull Requests
# Workflow:
#   1. Lint & Type Check (parallel: backend + frontend)
#   2. Unit Tests (parallel: backend + frontend)
#   3. Build Docker Images
#   4. E2E Tests (Playwright against Docker containers)
#   5. Push to Registry (main branch only)
#   6. Deploy to K8s (main branch only)

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}
  NODE_VERSION: '20'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # STAGE 1: Lint & Type Check
  # ============================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.target }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.target }}

      - name: Generate Prisma Client (backend only)
        if: matrix.target == 'backend'
        run: npx prisma generate
        working-directory: backend

      - name: Lint
        run: npm run lint
        working-directory: ${{ matrix.target }}

      - name: Type Check
        run: npx tsc --noEmit
        working-directory: ${{ matrix.target }}

  # ============================================
  # STAGE 2: Unit Tests
  # ============================================
  test-backend:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: medlab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: backend

      - name: Apply migrations
        run: npx prisma migrate deploy
        working-directory: backend
        env:
          DATABASE_URL: postgresql://admin:testpassword@localhost:5432/medlab_test

      - name: Run unit tests
        run: npm run test -- --passWithNoTests --ci
        working-directory: backend
        env:
          DATABASE_URL: postgresql://admin:testpassword@localhost:5432/medlab_test
          JWT_SECRET: ci-test-secret-key-for-jwt-tokens
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

      - name: Run E2E tests
        run: npm run test:e2e -- --passWithNoTests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://admin:testpassword@localhost:5432/medlab_test
          JWT_SECRET: ci-test-secret-key-for-jwt-tokens
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

  test-frontend:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run unit tests
        run: npm run test -- --run --passWithNoTests
        working-directory: frontend

  # ============================================
  # STAGE 3: Build
  # ============================================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: backend
            image: medlab-api
          - target: frontend
            image: medlab-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.target }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # STAGE 4: E2E Tests (Playwright)
  # ============================================
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: e2epassword
          POSTGRES_DB: medlab_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma & apply migrations & seed
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npx prisma db seed
        working-directory: backend
        env:
          DATABASE_URL: postgresql://admin:e2epassword@localhost:5432/medlab_e2e

      - name: Start backend
        run: |
          npm run start:dev &
          sleep 10
        working-directory: backend
        env:
          DATABASE_URL: postgresql://admin:e2epassword@localhost:5432/medlab_e2e
          JWT_SECRET: e2e-ci-jwt-secret-key
          REDIS_URL: redis://localhost:6379
          PORT: 3005
          NODE_ENV: development

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Start frontend preview
        run: |
          npm run preview -- --port 5173 &
          sleep 5
        working-directory: frontend

      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          PLAYWRIGHT_API_URL: http://localhost:3005
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

  # ============================================
  # STAGE 5: Deploy to Kubernetes
  # ============================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Update image tags
        run: |
          export IMAGE_TAG=${{ github.sha }}
          cd k8s
          sed -i "s|IMAGE_TAG_PLACEHOLDER|${IMAGE_TAG}|g" backend-deployment.yaml
          sed -i "s|IMAGE_TAG_PLACEHOLDER|${IMAGE_TAG}|g" frontend-deployment.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/secrets.yaml
          kubectl apply -f k8s/postgres-deployment.yaml
          kubectl apply -f k8s/redis-deployment.yaml
          kubectl apply -f k8s/minio-deployment.yaml
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/backup-cronjob.yaml

      - name: Run database migrations
        run: |
          kubectl -n medlab exec deploy/medlab-backend -- npx prisma migrate deploy

      - name: Verify deployment
        run: |
          kubectl -n medlab rollout status deploy/medlab-backend --timeout=180s
          kubectl -n medlab rollout status deploy/medlab-frontend --timeout=120s

      - name: Health check
        run: |
          sleep 15
          HEALTH_URL=$(kubectl -n medlab get ingress medlab-ingress -o jsonpath='{.spec.rules[0].host}')
          curl -sf "https://${HEALTH_URL}/api/health" || echo "⚠️ Health check pending (DNS propagation may take time)"
